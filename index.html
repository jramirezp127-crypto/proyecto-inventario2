<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Inventario Futurista
    </title>


    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

    <div class="fondo"></div>

    <div class="particulas">

        <span style="left:10%"></span>
        <span style="left:20%"></span>
        <span style="left:35%"></span>
        <span style="left:50%"></span>
        <span style="left:65%"></span>
        <span style="left:80%"></span>

    </div>

    <main class="container">

        <h1>
            Inventario productos JB
        </h1>

        <form
            id="producto-form"
            class="card"
        >

            <h2>
                Agregar producto
            </h2>

            <input
                id="nombre"
                type="text"
                placeholder="Nombre"
                required
            >

            <input
    id="precio"
    type="number"
    placeholder="Precio"
    required
>

<div class="precios-rapidos">

    <button
        type="button"
        onclick="ponerPrecio(1000)"
    >
        $1.000
    </button>

    <button
        type="button"
        onclick="ponerPrecio(2000)"
    >
        $2.000
    </button>

    <button
        type="button"
        onclick="ponerPrecio(3000)"
    >
        $3.000
    </button>

    <button
        type="button"
        onclick="ponerPrecio(5000)"
    >
        $5.000
    </button>

    <button
        type="button"
        onclick="ponerPrecio(10000)"
    >
        $10.000
    </button>

    <button
        type="button"
        onclick="ponerPrecio(20000)"
    >
        $20.000
    </button>

    <button
        type="button"
        onclick="ponerPrecio(50000)"
    >
        $50.000
    </button>

    <button
        type="button"
        onclick="ponerPrecio(100000)"
    >
        $100.000
    </button>

</div>

            <input
                id="stock"
                type="number"
                placeholder="Stock"
                required
            >

            <input
                id="imagen"
                type="file"
                accept="image/*"
            >

         <button>
    Guardar producto
</button>


<div class="resumen">

    <h3 id="total-productos">
        Productos: 0
    </h3>

    <h3 id="total-dinero">
        Total: $0
    </h3>

</div>

</form>
        <section class="card">

            <h2>
                Productos
            </h2>

            <input
                id="buscar"
                type="text"
                placeholder="Buscar producto..."
            >

            <ul id="lista-productos"></ul>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
