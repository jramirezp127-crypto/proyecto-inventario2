<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario JS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Inventario</h1>

    <form id="producto-form" class="card">
      <h2 id="form-title">Agregar producto</h2>
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" required>

      <label for="precio">Precio</label>
      <input id="precio" type="number" min="0" step="0.01" required>

      <label for="stock">Stock</label>
      <input id="stock" type="number" min="0" step="1" required>

      <button id="btn-guardar" type="submit">Guardar</button>
      <p id="mensaje"></p>
    </form>

    <section class="card">
      <h2>Lista de productos</h2>
      <label for="buscar">Buscar por nombre</label>
      <input id="buscar" type="text" placeholder="Ej: cuaderno">
      <ul id="lista-productos"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
