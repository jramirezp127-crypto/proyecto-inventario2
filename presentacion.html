<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación</title>

    <style>
        body{
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .contenedor{
            background:white;
            padding:40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,0.3);
        }

        h1{
            color:#0077ff;
        }

        p{
            font-size:20px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Julian y Brayan Forever 💙</h1>
        <p><strong>Curso:</strong> 1113</p>
        <p>Python 🐍</p>
    </div>

</body>
</html>
