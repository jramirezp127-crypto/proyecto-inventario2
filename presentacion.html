<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fusion Style</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:'Poppins', sans-serif;
    background:black;
}

/* Fondo fusionado */

body::before{
    content:'';
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(circle,#00f7ff 10%,transparent 20%),
    radial-gradient(circle,#ff00ea 10%,transparent 20%),
    radial-gradient(circle,#001aff 10%,transparent 20%);
    background-size:30% 30%;
    animation:fusion 12s linear infinite;
    filter:blur(80px);
}

@keyframes fusion{
    0%{
        transform:rotate(0deg) scale(1);
    }
    50%{
        transform:rotate(180deg) scale(1.2);
    }
    100%{
        transform:rotate(360deg) scale(1);
    }
}

/* Tarjeta */

.card{
    position:relative;
    width:450px;
    padding:45px;
    border-radius:30px;
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(20px);
    text-align:center;
    color:white;
    z-index:10;
    box-shadow:
    0 0 30px #00f7ff,
    0 0 60px #ff00ea;
    animation:flotar 4s ease-in-out infinite;
}

@keyframes flotar{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-15px);
    }
    100%{
        transform:translateY(0px);
    }
}

/* Imagen */

.foto{
    width:150px;
    height:150px;
    border-radius:50%;
    border:5px solid white;
    margin-bottom:20px;
    box-shadow:
    0 0 20px #00f7ff,
    0 0 40px #ff00ea;
    transition:0.5s;
}

.foto:hover{
    transform:scale(1.1) rotate(8deg);
}

/* Texto */

h1{
    font-size:42px;
    font-family:'Orbitron', sans-serif;
    margin-bottom:10px;
    background:linear-gradient(90deg,#00f7ff,#ff00ea,#00f7ff);
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:textoFusion 5s linear infinite;
}

@keyframes textoFusion{
    0%{
        background-position:0%;
    }
    100%{
        background-position:300%;
    }
}

p{
    font-size:20px;
    margin:12px 0;
}

/* Caja */

.info{
    margin-top:25px;
    display:flex;
    justify-content:space-between;
}

.box{
    width:48%;
    padding:20px;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
    transition:0.4s;
}

.box:hover{
    transform:scale(1.08);
    box-shadow:
    0 0 20px #00f7ff,
    0 0 30px #ff00ea;
}

/* Botón */

.boton{
    margin-top:30px;
    display:inline-block;
    padding:15px 35px;
    border-radius:40px;
    text-decoration:none;
    color:white;
    font-weight:bold;
    background:linear-gradient(45deg,#00f7ff,#ff00ea);
    background-size:300%;
    animation:btnFusion 4s infinite linear;
    transition:0.4s;
}

@keyframes btnFusion{
    0%{
        background-position:0%;
    }
    100%{
        background-position:300%;
    }
}

.boton:hover{
    transform:scale(1.1);
}

</style>
</head>

<body>

<div class="card">

    <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" class="foto">

    <h1>Julian & Brayan</h1>

    <p>Curso: 1113 🎓</p>

    <p>Python </p>

    <div class="info">

        <div class="box">
            🚀 Programación
        </div>

        <div class="box">
            💻 Developers
        </div>

    </div>

    <a href="#" class="boton">
        ENTER
    </a>

</div>

</body>
</html>
