<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación Épica</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            font-family:'Poppins', sans-serif;
            background:black;
        }

        /* Fondo animado */

        .fondo{
            position:absolute;
            width:100%;
            height:100%;
            background:
            radial-gradient(circle at top left,#00f7ff,transparent 30%),
            radial-gradient(circle at bottom right,#ff00ea,transparent 30%),
            radial-gradient(circle at center,#001aff,transparent 40%);
            animation:mover 8s infinite alternate;
            filter:blur(40px);
        }

        @keyframes mover{
            0%{
                transform:scale(1) rotate(0deg);
            }
            100%{
                transform:scale(1.2) rotate(8deg);
            }
        }

        /* Partículas */

        .particulas span{
            position:absolute;
            width:4px;
            height:4px;
            background:white;
            border-radius:50%;
            animation:subir 10s linear infinite;
            opacity:0.6;
        }

        @keyframes subir{
            0%{
                transform:translateY(100vh) scale(0);
            }
            100%{
                transform:translateY(-10vh) scale(1);
            }
        }

        /* Tarjeta principal */

        .card{
            position:relative;
            width:450px;
            padding:45px;
            border-radius:30px;
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.2);
            backdrop-filter:blur(20px);
            box-shadow:
            0 0 30px rgba(0,255,255,0.4),
            0 0 60px rgba(255,0,255,0.2);
            text-align:center;
            z-index:10;
            animation:flotar 4s ease-in-out infinite;
        }

        @keyframes flotar{
            0%{transform:translateY(0px);}
            50%{transform:translateY(-15px);}
            100%{transform:translateY(0px);}
        }

        .foto{
            width:150px;
            height:150px;
            border-radius:50%;
            border:5px solid #00f7ff;
            box-shadow:0 0 25px #00f7ff;
            margin-bottom:20px;
            transition:0.5s;
        }

        .foto:hover{
            transform:scale(1.08) rotate(5deg);
        }

        h1{
            color:white;
            font-size:42px;
            font-family:'Orbitron', sans-serif;
            text-shadow:0 0 15px #00f7ff;
            margin-bottom:15px;
        }

        .subtitulo{
            color:#cfcfcf;
            margin-bottom:25px;
            font-size:18px;
        }

        .info{
            display:flex;
            justify-content:space-around;
            margin-top:25px;
        }

        .box{
            background:rgba(255,255,255,0.1);
            padding:18px;
            width:45%;
            border-radius:20px;
            transition:0.4s;
            border:1px solid rgba(255,255,255,0.1);
        }

        .box:hover{
            transform:translateY(-8px) scale(1.05);
            box-shadow:0 0 20px rgba(255,255,255,0.3);
        }

        .titulo{
            color:#00f7ff;
            font-weight:bold;
            margin-bottom:10px;
            font-size:20px;
        }

        .texto{
            color:white;
            font-size:18px;
        }

        .boton{
            display:inline-block;
            margin-top:30px;
            padding:15px 35px;
            border-radius:40px;
            text-decoration:none;
            color:white;
            font-weight:bold;
            background:linear-gradient(45deg,#00f7ff,#ff00ea);
            box-shadow:0 0 20px rgba(255,0,234,0.6);
            transition:0.5s;
        }

        .boton:hover{
            transform:scale(1.1);
            box-shadow:0 0 35px rgba(0,247,255,1);
        }

    </style>
</head>
<body>

    <div class="fondo"></div>

    <div class="particulas">
        <span style="left:10%; animation-delay:0s;"></span>
        <span style="left:20%; animation-delay:2s;"></span>
        <span style="left:35%; animation-delay:4s;"></span>
        <span style="left:50%; animation-delay:1s;"></span>
        <span style="left:65%; animation-delay:3s;"></span>
        <span style="left:80%; animation-delay:5s;"></span>
        <span style="left:90%; animation-delay:6s;"></span>
    </div>

    <div class="card">

        <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" class="foto">

        <h1>Julian & Brayan</h1>

        <p class="subtitulo">
            Future Developers 🚀
        </p>

        <div class="info">

            <div class="box">
                <div class="titulo">Curso</div>
                <div class="texto">1113</div>
            </div>

            <div class="box">
                <div class="titulo">Lenguaje</div>
                <div class="texto">Python 🐍</div>
            </div>

        </div>

        <a href="#" class="boton">
            Bienvenidos
        </a>

    </div>

</body>
</html>
